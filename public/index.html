<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudoku Game</title>
    <link rel="stylesheet" href="../styles/style.css">
    <link href="https://unpkg.com/tailwindcss@^1.0/dist/tailwind.min.css" rel="stylesheet">
</head>
<body>
    <div class="main">
        <div class="nav">
            <h2 class="font-bold text-3xl">SUDOKU</h2>
            <div class="login">
                <h3 id="fname"></h3>
                <img src="../assets/username_img.png" alt="User Image">
            </div>
        </div>
    </div>
    
    <div class="timeSpent"></div>
    
    <div class="parent">
        <div class="box">
            <div class="sudoku-table"></div>
            <div class="buttons">
                <button id="NewGame"><b>New Game</b></button>
                <button id="Hint"><b>Give Hint</b></button>
                <button id="End-Game"><b>End Game</b></button>
            </div>
        </div>

        <div id="HintsError">
            <p id="errorMsg"><b>Error!</b></p>
            <div id="whitespace">
                <div id="text">
                    <p><b>OOPS!</b></p>
                    <p>Limited Hints Available.</p>
                    <p>Better Luck Next Time.</p>
                </div>
                <button id="NewGame_Error_1">New Game</button>
            </div>
        </div>

        <div id="WrongInputError">
            <p id="errorMsg"><b>Error!</b></p>
            <div id="whitespace">
                <div id="text">
                    <p><b>OOPS!</b></p>
                    <p>Wrong Input Entered.</p>
                </div>
                <div class="errorbtns">
                    <button id="Go-Back">Go Back</button>
                    <button id="NewGame_Error_2">New Game</button>
                </div>
            </div>
        </div>

        <div id="SuccessMsg">
            <p id="errorMsg"><b>SUCCESS!</b></p>
            <div id="whitespace">
                <div id="text">
                    <p><b>CONGRATULATIONS!</b></p>
                    <p>You have completed the Sudoku.</p>
                    <p>Solve another one to increase your rating.</p>
                </div>
                <button id="NewGame_Success">New Game</button>
            </div>
        </div>

        <div id="SuccessError">
            <p id="errorMsg"><b>ERROR!</b></p>
            <div id="whitespace">
                <div id="text">
                    <p>Complete this Sudoku first or start a new game.</p>
                </div>
                <div class="errorbtns">
                    <button id="Go-Back-1">Go Back</button>
                    <button id="NewGame_Error_3">New Game</button>
                </div>
            </div>
        </div>
    </div>

    <script src="../script.js"></script>
</body>
</html>
